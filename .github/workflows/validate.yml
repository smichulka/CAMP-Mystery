name: Validate CAMP-Mystery

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rojo" "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip \
            --output "$RUNNER_TEMP/rojo.zip"
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          install -m 0755 "$RUNNER_TEMP/rojo/rojo" "$RUNNER_TEMP/bin/rojo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rojo" --version
      - name: Install pinned Luau compiler 0.726
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luau" "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            https://github.com/luau-lang/luau/releases/download/0.726/luau-ubuntu.zip \
            --output "$RUNNER_TEMP/luau.zip"
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          install -m 0755 "$RUNNER_TEMP/luau/luau-compile" "$RUNNER_TEMP/bin/luau-compile"
          "$RUNNER_TEMP/bin/luau-compile" --help >/dev/null
      - name: Run repository checks and write scoped evidence
        run: python scripts/release_gate.py --require-rojo --commit "$GITHUB_SHA"
      - name: Upload repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-mystery-repository-evidence-${{ github.sha }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 30
