name: Apply runtime E2E fixes

on:
  push:
    branches:
      - agent/e2e-audit-20260725

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic runtime fixes
        run: python scripts/apply_runtime_fixes.py
      - name: Install Rokit and pinned project tools
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install
      - name: Run complete repository gate
        run: python scripts/run_all_checks.py --require-rojo
      - name: Reject malformed diff
        run: git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Fix E2E audit findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
